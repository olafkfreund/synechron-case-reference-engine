[project]
name = "reference-engine"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi", "uvicorn", "jinja2", "psycopg[binary]", "pydantic", "litellm",
  "docling", "docxtpl", "python-pptx", "httpx", "authlib", "boto3",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"  # /app is read-only for the app user
