services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: refs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15
  # Dev only: this mock provider mints any login with any claims.
  idp:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG: '{"interactiveLogin": true}'
    networks:
      default:
        aliases:
          - idp.localhost
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:dev@db/refs
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql://postgres:dev@db/refs
      DB_INIT_ON_START: "1"  # local only; in AWS app.migrate does this
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    command: uvicorn --factory app.main:create_app --host 0.0.0.0 --port 8000 --proxy-headers
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:dev@db/refs
      DB_INIT_ON_START: "1"  # local only; in AWS app.migrate does this
      SESSION_SECRET: dev-only-not-a-secret
      SESSION_HTTPS_ONLY: "false"  # dev over http only
      APP_ORIGIN: http://localhost:8000
      OIDC_METADATA_URL: http://idp.localhost:8080/refs/.well-known/openid-configuration
      OIDC_CLIENT_ID: refs-local
      OIDC_CLIENT_SECRET: dev-only-not-a-secret
      ROLE_USER_GROUPS: refs-users
      ROLE_REVIEWER_GROUPS: refs-reviewers
      ROLE_ADMIN_GROUPS: refs-admins
    depends_on:
      db:
        condition: service_healthy
      idp:
        condition: service_started
