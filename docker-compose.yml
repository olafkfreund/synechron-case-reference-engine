services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: refs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:dev@db/refs
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql://postgres:dev@db/refs
    depends_on:
      db:
        condition: service_healthy
