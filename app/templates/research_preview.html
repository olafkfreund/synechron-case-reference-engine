{% extends "base.html" %}
{% block body %}
<h1>Send this search?</h1>
{% if note %}<div class="note">{{ note }}</div>{% endif %}
<p>This exact text will be sent to a public web search engine:</p>
<p><code>{{ query }}</code></p>
<form method="post" action="/research/send" style="display:inline"><input type="hidden" name="query" value="{{ query }}">
<button>Send</button></form>
<a href="/research">Cancel</a>
{% endblock %}
