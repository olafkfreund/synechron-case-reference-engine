{% extends "base.html" %}
{% block body %}
<h1>Send this search?</h1>
{% if note %}<div class="note">{{ note }}</div>{% endif %}
<div class="card stack"><p style="margin:0"><b>2. Exactly this will be sent to a public web search engine:</b></p>
<code>{{ query }}</code>
<div class="row"><form method="post" action="/research/send" style="margin:0"><input type="hidden" name="query" value="{{ query }}">{% if case_id %}<input type="hidden" name="case_id" value="{{ case_id }}">{% endif %}
<button class="btn primary">Send</button></form>
<a class="btn" href="/research">Cancel</a></div></div>
{% endblock %}
