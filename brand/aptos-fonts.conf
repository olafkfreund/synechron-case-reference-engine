<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Office names Aptos weights as families ("Aptos Bold" is the brand template's heading font); the
     Microsoft download installs one family "Aptos" with styles. Map the names so LibreOffice finds them (#282). -->
<fontconfig>
  <match target="pattern"><test name="family"><string>Aptos Bold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Aptos</string></edit><edit name="weight" mode="assign"><const>bold</const></edit></match>
  <match target="pattern"><test name="family"><string>Aptos SemiBold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Aptos</string></edit><edit name="weight" mode="assign"><const>semibold</const></edit></match>
  <match target="pattern"><test name="family"><string>Aptos Light</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Aptos</string></edit><edit name="weight" mode="assign"><const>light</const></edit></match>
  <match target="pattern"><test name="family"><string>Aptos ExtraBold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Aptos</string></edit><edit name="weight" mode="assign"><const>extrabold</const></edit></match>
  <match target="pattern"><test name="family"><string>Aptos Display</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Aptos</string></edit></match>
</fontconfig>
